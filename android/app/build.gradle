plugins { id 'com.android.application' }
android {
    namespace 'com.econectapp.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.econectapp.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1-preview'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // This is an internal preview. Release/AAB generation stays disabled until
    // billing, moderation, account deletion and store declarations are complete.
    variantFilter { variant -> if (variant.buildType.name == 'release') variant.setIgnore(true) }
}
